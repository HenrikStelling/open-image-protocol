[project]
name = "oip"
version = "0.1.0"
description = "Open Image Protocol: self-describing medical image packages for vision-language models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["pydicom>=3.0", "numpy>=1.26", "pillow>=10", "jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "pylibjpeg", "pylibjpeg-libjpeg", "kagglehub"]

[project.scripts]
oip = "oip.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
