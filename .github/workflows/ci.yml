name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests (phantoms, scorer, runner conditions)
        run: python -m pytest -q
      - name: Validate example packages
        run: for p in spec/examples/*.oip; do python -m oip.cli validate "$p"; done
      - name: Examples are reproducible
        run: |
          python scripts/make_examples.py > /dev/null
          git diff --exit-code --stat -- spec/examples data/samples
